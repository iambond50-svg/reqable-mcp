[project]
name = "reqable-mcp"
version = "2.0.0"
description = "MCP Server for Reqable - Python port of reqable-mcp-server"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
